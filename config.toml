# FingerMaze configuration

[display]
width = 1280
height = 720
fullscreen = false
target_fps = 60

[camera]
device_index = 0
width = 640
height = 480
fps = 30
mirror = true

[tracking]
model_path = "models/hand_landmarker.task"
num_hands = 1
min_detection_confidence = 0.5
min_tracking_confidence = 0.5
hand_lost_timeout_s = 1.0
filter_min_cutoff = 1.0
filter_beta = 0.05

[maze]
cols = 16
rows = 10
wall_thickness = 8
cursor_radius = 12
wall_penalty_seconds = 3.0
